<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestionnaire de Décors</title>
  <!-- Chargement sécurisé du SDK Owlbear Rodeo -->
  <script src="https://sdk.owlbear.rodeo/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 12px;
      margin: 0;
    }
    h3 { margin-top: 0; color: #f38ba8; text-align: center; font-size: 16px; }
    .card {
      background: #313244;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      background: #181825;
      border: 1px solid #45475a;
      color: #fff;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-add { background: #a6e3a1; color: #11111b; }
    .btn-show { background: #89b4fa; color: #11111b; width: auto; padding: 4px 8px; }
    .btn-close { background: #f38ba8; color: #11111b; margin-top: 10px; }
    
    #statusBox {
      display: none;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .status-error { background: #f38ba8; color: #11111b; font-weight: bold; }
    .status-success { background: #a6e3a1; color: #11111b; font-weight: bold; }

    .decor-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #181825;
      padding: 6px 10px;
      border-radius: 4px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <h3>🎬 Décors d'Ambiance</h3>
  <div id="statusBox"></div>

  <div class="card">
    <input type="text" id="decorTitle" placeholder="Nom du lieu (ex: Le Diner)">
    <input type="text" id="decorUrl" placeholder="URL de l'image (HTTPS)">
    <button class="btn-add" id="addBtn">➕ Ajouter le Décor</button>
  </div>

  <div class="card" id="decorList">
    <small style="color: #a6adc8;">Aucun décor enregistré.</small>
  </div>

  <button class="btn-close" id="closeAllBtn">🛑 Masquer le Décor</button>

  <script>
    let decors = [];

    function showStatus(message, type = "success") {
      const box = document.getElementById('statusBox');
      box.className = `status-${type}`;
      box.innerText = message;
      box.style.display = 'block';
      setTimeout(() => { box.style.display = 'none'; }, 3000);
    }

    window.showDecor = async function(index) {
      try {
        const decor = decors[index];
        if (!decor) return;

        await OBR.broadcast.sendMessage("DECOR_EVENT", { action: "SHOW", url: decor.url });
        await OBR.modal.open({
          id: "owlbear-decor-display",
          url: `https://tekjpdi.github.io/owlbear-decor-extension/display.html?img=${encodeURIComponent(decor.url)}`,
          fullScreen: true
        });

        showStatus(`Projeté : ${decor.title}`, "success");
      } catch (err) {
        showStatus(`Erreur : ${err.message}`, "error");
      }
    };

    // Vérification de la disponibilité d'Owlbear Rodeo SDK
    if (typeof OBR === 'undefined') {
      console.error("Le SDK Owlbear Rodeo n'a pas pu être chargé.");
      document.body.innerHTML = '<h3 style="color: #f38ba8; text-align:center; padding: 20px;">Erreur : Impossible de charger le SDK Owlbear Rodeo. Vérifiez votre connexion ou vos extensions de blocage (uBlock Origin).</h3>';
    } else {
      OBR.onReady(() => {
        document.getElementById('addBtn').addEventListener('click', () => {
          const title = document.getElementById('decorTitle').value.trim();
          const url = document.getElementById('decorUrl').value.trim();

          if (!title || !url) {
            showStatus("Veuillez remplir le nom et l'URL.", "error");
            return;
          }

          decors.push({ title, url });
          renderList();

          document.getElementById('decorTitle', 'decorUrl').value = '';
          document.getElementById('decorTitle').value = '';
          document.getElementById('decorUrl').value = '';
          showStatus("Décor ajouté à la liste !", "success");
        });

        document.getElementById('closeAllBtn').addEventListener('click', async () => {
          try {
            await OBR.broadcast.sendMessage("DECOR_EVENT", { action: "CLOSE" });
            await OBR.modal.close("owlbear-decor-display");
            showStatus("Décor masqué.", "success");
          } catch (err) {
            showStatus(`Erreur : ${err.message}`, "error");
          }
        });
      });
    }

    function renderList() {
      const container = document.getElementById('decorList');
      container.innerHTML = '';
      decors.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'decor-item';
        div.innerHTML = `
          <span><b>${item.title}</b></span>
          <button class="btn-show" onclick="window.showDecor(${index})">📺 Projeter</button>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
