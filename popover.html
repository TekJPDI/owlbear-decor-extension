<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestionnaire de Décors</title>
  <script src="https://sdk.owlbear.rodeo/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 12px;
      margin: 0;
    }
    h3 { margin-top: 0; color: #f38ba8; text-align: center; font-size: 16px; }
    .card {
      background: #313244;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    input[type="text"], input[type="file"] {
      width: 100%;
      padding: 8px;
      margin-bottom: 8px;
      background: #181825;
      border: 1px solid #45475a;
      color: #fff;
      border-radius: 4px;
    }
    input[type="file"] { font-size: 12px; cursor: pointer; }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-add { background: #a6e3a1; color: #11111b; }
    .btn-add:disabled { background: #585b70; cursor: not-allowed; }
    .btn-show { background: #89b4fa; color: #11111b; width: auto; padding: 4px 8px; }
    .btn-close { background: #f38ba8; color: #11111b; margin-top: 10px; }
    
    #statusBox {
      display: none;
      padding: 8px;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 8px;
      word-break: break-word;
    }
    .status-error { background: #f38ba8; color: #11111b; font-weight: bold; }
    .status-success { background: #a6e3a1; color: #11111b; font-weight: bold; }
    .status-info { background: #89b4fa; color: #11111b; }

    .decor-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #181825;
      padding: 6px 10px;
      border-radius: 4px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <h3>🎬 Décors Locaux</h3>

  <div id="statusBox"></div>

  <div class="card">
    <input type="text" id="decorTitle" placeholder="Nom du lieu (ex: Le Diner)">
    <input type="file" id="decorFile" accept="image/*">
    <button class="btn-add" id="addBtn">➕ Importer depuis mon PC</button>
  </div>

  <div class="card" id="decorList">
    <small style="color: #a6adc8;">Aucun décor chargé pour le moment.</small>
  </div>

  <button class="btn-close" id="closeAllBtn">🛑 Retirer l'Écran de Décor</button>

  <script>
    let decors = [];

    function showStatus(message, type = "error") {
      const box = document.getElementById('statusBox');
      box.className = `status-${type}`;
      box.innerText = message;
      box.style.display = 'block';
      if (type === "success") {
        setTimeout(() => { box.style.display = 'none'; }, 4000);
      }
    }

    // Fonction pour redimensionner/compresser l'image rapidement via Canvas
    function compressImage(file, maxWidth = 1920, maxHeight = 1080, quality = 0.85) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > maxWidth || height > maxHeight) {
              if (width / height > maxWidth / maxHeight) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              } else {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // Exportation en WebP léger (ou JPEG si non supporté)
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => reject(new Error("Erreur de chargement de l'image."));
          img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error("Erreur de lecture du fichier."));
        reader.readAsDataURL(file);
      });
    }

    window.showDecor = function(index) {
      try {
        const decor = decors[index];
        if (!decor) throw new Error("Décor introuvable.");

        OBR.broadcast.sendMessage("DECOR_EVENT", { action: "SHOW", dataUrl: decor.dataUrl });
        OBR.modal.open({
          url: "https://tekjpdi.github.io/owlbear-decor-extension/display.html",
          fullScreen: true
        });
        showStatus(`Décor "${decor.title}" projeté !`, "success");
      } catch (err) {
        showStatus(`Erreur de projection : ${err.message}`, "error");
      }
    };

    OBR.onReady(() => {
      const addBtn = document.getElementById('addBtn');

      addBtn.addEventListener('click', async () => {
        try {
          const titleInput = document.getElementById('decorTitle');
          const fileInput = document.getElementById('decorFile');
          
          const title = titleInput.value.trim();
          const file = fileInput.files[0];

          if (!title) return showStatus("⚠️ Entrez un nom pour le décor.", "error");
          if (!file) return showStatus("⚠️ Choisissez une image sur votre PC.", "error");

          addBtn.disabled = true;
          addBtn.innerText = "⏳ Optimisation de l'image...";
          showStatus("Traitement rapide de l'image...", "info");

          // Compression à la volée en 1080p HD
          const compressedDataUrl = await compressImage(file, 1920, 1080, 0.85);

          decors.push({ title: title, dataUrl: compressedDataUrl });
          renderList();

          titleInput.value = '';
          fileInput.value = '';
          showStatus(`✅ Décor "${title}" ajouté avec succès !`, "success");

        } catch (err) {
          showStatus(`⚠️ ${err.message}`, "error");
        } finally {
          addBtn.disabled = false;
          addBtn.innerText = "➕ Importer depuis mon PC";
        }
      });

      document.getElementById('closeAllBtn').addEventListener('click', () => {
        OBR.broadcast.sendMessage("DECOR_EVENT", { action: "CLOSE" });
        OBR.modal.close();
        showStatus("Écran de décor retiré.", "info");
      });
    });

    function renderList() {
      const container = document.getElementById('decorList');
      container.innerHTML = '';
      decors.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'decor-item';
        div.innerHTML = `
          <span><b>${item.title}</b></span>
          <button class="btn-show" onclick="window.showDecor(${index})">📺 Projeter</button>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
