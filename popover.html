<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Décors d'ambiance</title>
  <style>
    :root {
      --ink: #14161d;
      --panel: #1d2029;
      --line: #2e3240;
      --text: #ece7da;
      --muted: #9b9889;
      --lantern: #e0b25a;
      --lantern-ink: #2a1f08;
      --danger: #e07a6a;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--ink);
      color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 14px;
      display: flex; flex-direction: column; gap: 14px;
      overflow-y: auto;
    }
    h1 {
      margin: 0;
      font: italic 600 1.35rem/1.2 Georgia, "Times New Roman", serif;
      letter-spacing: .01em;
    }
    h2 { margin: 0 0 8px; font-size: .95rem; font-weight: 600; }

    #status {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 52px;
    }
    #status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
    #status.on { border-color: var(--lantern); }
    #status.on .dot { background: var(--lantern); box-shadow: 0 0 8px var(--lantern); }
    #status img { width: 56px; height: 36px; object-fit: cover; border-radius: 4px; flex: none; }
    #status .txt { flex: 1; min-width: 0; }
    #status .txt strong, #status .txt small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #status small { color: var(--muted); }

    form { display: grid; gap: 8px; }
    label { display: grid; gap: 4px; color: var(--muted); font-size: .85rem; }
    input[type="text"], input[type="url"] {
      width: 100%;
      font: inherit; color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: .55em .7em;
    }
    input:focus-visible { outline: 2px solid var(--lantern); outline-offset: 1px; border-color: transparent; }

    .row { display: flex; gap: 8px; }
    button {
      font: inherit; cursor: pointer;
      color: var(--text);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: .5em .85em;
    }
    button:hover:not(:disabled) { border-color: var(--lantern); color: var(--lantern); }
    button:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    button.primary { background: var(--lantern); color: var(--lantern-ink); border-color: var(--lantern); font-weight: 600; flex: 1; }
    button.primary:hover:not(:disabled) { background: #edc272; color: var(--lantern-ink); }
    button.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }

    #scene-link {
      display: flex; align-items: center; gap: 10px;
      padding: 6px; margin-bottom: 8px; min-height: 52px;
      background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    }
    #scene-link img { width: 64px; height: 40px; object-fit: cover; border-radius: 4px; flex: none; }
    #scene-link .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #scene-link .txt small { display: block; color: var(--muted); }
    .check { display: flex; align-items: flex-start; gap: 8px; margin-top: 8px; color: var(--text); }
    .check input { margin-top: 3px; accent-color: var(--lantern); }
    #message { min-height: 1.3em; font-size: .85rem; color: var(--muted); }
    #message.error { color: var(--danger); }

    #library { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    #library li {
      display: flex; align-items: center; gap: 10px;
      padding: 6px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    #library li.current { border-color: var(--lantern); }
    #library img { width: 64px; height: 40px; object-fit: cover; border-radius: 4px; background: #000; flex: none; }
    #library .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #library button { padding: .35em .6em; font-size: .85rem; }
    .empty { color: var(--muted); font-size: .9rem; margin: 0; }

    #locked {
      display: none;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
    }
    body.player #locked { display: block; }
    body.player main { display: none; }
    main { display: flex; flex-direction: column; gap: 14px; }
  </style>
</head>
<body>

  <h1>Décors d'ambiance</h1>

  <div id="locked">Seul le MJ peut changer le décor. Quand il en affiche un, il apparaît automatiquement en plein écran.</div>

  <main>
    <div id="status" aria-live="polite">
      <span class="dot"></span>
      <div class="txt"><strong>Aucun décor affiché</strong></div>
    </div>

    <form id="form" autocomplete="off">
      <label>Adresse de l'image (lien direct, https)
        <input id="url" type="url" required placeholder="https://exemple.com/taverne.jpg">
      </label>
      <label>Légende (facultatif)
        <input id="title" type="text" maxlength="80" placeholder="La Taverne du Sanglier Rouge">
      </label>
      <div class="row">
        <button id="show" class="primary" type="submit">Afficher pour tous</button>
        <button id="save" type="button">Ajouter à la bibliothèque</button>
      </div>
      <div class="row">
        <button id="hide" class="danger" type="button" style="flex:1">Retirer le décor pour tous</button>
      </div>
      <div id="message" role="status"></div>
    </form>

    <section>
      <h2>Scène actuelle</h2>
      <div id="scene-link"></div>
      <div class="row">
        <button id="link" type="button" style="flex:1">Lier l'image saisie</button>
        <button id="replay" type="button">Réafficher</button>
        <button id="unlink" class="danger" type="button">Délier</button>
      </div>
      <label class="check">
        <input id="auto" type="checkbox">
        <span>Afficher le décor lié à chaque changement de scène</span>
      </label>
    </section>

    <section>
      <h2>Bibliothèque</h2>
      <ul id="library"></ul>
      <p id="empty" class="empty" hidden>Aucun décor enregistré. Ajoutez une adresse d'image ci-dessus pour la retrouver ici.</p>
    </section>
  </main>

  <script type="module">
    import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3";

    const NS          = "com.tekjpdi.decor";
    const STATE_KEY   = `${NS}/state`;
    const LIBRARY_KEY = `${NS}/library`;
    const SCENE_KEY    = `${NS}/scene`;     // métadonnée de la scène : { url, title }
    const SETTINGS_KEY = `${NS}/settings`;  // métadonnée de salle : { auto }
    const MAX_ITEMS   = 30; // les métadonnées de salle sont limitées en taille

    const $ = (id) => document.getElementById(id);
    const els = {
      status: $("status"), form: $("form"), url: $("url"), title: $("title"),
      show: $("show"), save: $("save"), hide: $("hide"),
      scene: $("scene-link"), link: $("link"), replay: $("replay"), unlink: $("unlink"), auto: $("auto"),
      message: $("message"), library: $("library"), empty: $("empty")
    };

    let metadata = {};
    let isGM = false;
    let sceneReady = false;
    let sceneLink = null;

    /* ------------------------------ utilitaires ------------------------------ */
    function say(text, isError = false) {
      els.message.textContent = text;
      els.message.classList.toggle("error", isError);
    }

    function cleanUrl(raw) {
      try {
        const u = new URL(String(raw).trim());
        if (u.protocol !== "https:") return null; // Owlbear est en https : le http serait bloqué
        return u.toString();
      } catch (_) { return null; }
    }

    const getState   = () => metadata[STATE_KEY] || { active: false, url: "", title: "", ts: 0 };
    const getLibrary = () => Array.isArray(metadata[LIBRARY_KEY]) ? metadata[LIBRARY_KEY] : [];

    async function write(patch) {
      await OBR.room.setMetadata(patch);
    }

    /* -------------------------------- actions -------------------------------- */
    async function display(url, title) {
      await write({ [STATE_KEY]: { active: true, url, title: title || "", ts: Date.now() } });
    }

    async function clearDisplay() {
      const st = getState();
      await write({ [STATE_KEY]: { active: false, url: st.url, title: st.title, ts: Date.now() } });
    }

    async function addToLibrary(url, title) {
      const lib = getLibrary();
      if (lib.some((i) => i.url === url)) { say("Ce décor est déjà dans la bibliothèque."); return; }
      if (lib.length >= MAX_ITEMS) { say(`Bibliothèque pleine (${MAX_ITEMS} décors max). Supprimez-en un d'abord.`, true); return; }
      const name = title || decodeURIComponent(url.split("/").pop().split("?")[0] || "Décor").slice(0, 80);
      await write({ [LIBRARY_KEY]: [...lib, { id: crypto.randomUUID(), name, url }] });
      say("Ajouté à la bibliothèque.");
    }

    async function removeFromLibrary(id) {
      await write({ [LIBRARY_KEY]: getLibrary().filter((i) => i.id !== id) });
    }

    async function refreshScene() {
      sceneReady = await OBR.scene.isReady();
      sceneLink = null;
      if (sceneReady) sceneLink = (await OBR.scene.getMetadata())[SCENE_KEY] || null;
      renderScene();
    }

    async function linkScene(url, title) {
      if (!sceneReady) { say("Ouvrez d'abord une scène pour y lier un décor.", true); return; }
      await OBR.scene.setMetadata({ [SCENE_KEY]: { url, title: title || "" } });
      sceneLink = { url, title: title || "" };
      renderScene();
      await display(url, title);
      say("Décor lié à cette scène et affiché.");
    }

    /* -------------------------------- rendu -------------------------------- */
    function renderStatus() {
      const st = getState();
      els.status.classList.toggle("on", !!st.active);
      els.status.replaceChildren();

      const dot = document.createElement("span");
      dot.className = "dot";
      els.status.append(dot);

      if (st.active && st.url) {
        const img = document.createElement("img");
        img.src = st.url; img.alt = "";
        const txt = document.createElement("div");
        txt.className = "txt";
        const strong = document.createElement("strong");
        strong.textContent = st.title || "Décor affiché";
        const small = document.createElement("small");
        small.textContent = "Visible par tous les joueurs";
        txt.append(strong, small);
        els.status.append(img, txt);
      } else {
        const txt = document.createElement("div");
        txt.className = "txt";
        const strong = document.createElement("strong");
        strong.textContent = "Aucun décor affiché";
        txt.append(strong);
        els.status.append(txt);
      }
      els.hide.disabled = !st.active;
    }

    function renderLibrary() {
      const lib = getLibrary();
      const st = getState();
      els.library.replaceChildren();
      els.empty.hidden = lib.length > 0;

      for (const item of lib) {
        const li = document.createElement("li");
        if (st.active && st.url === item.url) li.classList.add("current");

        const img = document.createElement("img");
        img.src = item.url; img.alt = ""; img.loading = "lazy";

        const name = document.createElement("span");
        name.className = "name"; name.textContent = item.name; name.title = item.name;

        const go = document.createElement("button");
        go.type = "button"; go.textContent = "Afficher";
        go.addEventListener("click", async () => {
          try { await display(item.url, item.name); say(""); }
          catch (e) { say("Impossible d'afficher le décor : " + e.message, true); }
        });

        const lnk = document.createElement("button");
        lnk.type = "button"; lnk.textContent = "Lier";
        lnk.title = "Lier ce décor à la scène actuelle";
        lnk.addEventListener("click", async () => {
          try { await linkScene(item.url, item.name); }
          catch (e) { say("Liaison impossible : " + e.message, true); }
        });

        const del = document.createElement("button");
        del.type = "button"; del.className = "danger"; del.textContent = "✕";
        del.setAttribute("aria-label", `Supprimer ${item.name}`);
        del.addEventListener("click", async () => {
          try { await removeFromLibrary(item.id); }
          catch (e) { say("Suppression impossible : " + e.message, true); }
        });

        li.append(img, name, go, lnk, del);
        els.library.append(li);
      }
    }

    function renderScene() {
      els.scene.replaceChildren();
      const txt = document.createElement("div");
      txt.className = "txt";
      if (!sceneReady) {
        txt.textContent = "Aucune scène ouverte.";
      } else if (sceneLink && sceneLink.url) {
        const img = document.createElement("img");
        img.src = sceneLink.url; img.alt = "";
        const strong = document.createElement("strong");
        strong.textContent = sceneLink.title || "Décor lié";
        const small = document.createElement("small");
        small.textContent = "S'affiche quand vous ouvrez cette scène";
        txt.append(strong, small);
        els.scene.append(img);
      } else {
        txt.textContent = "Aucun décor lié à cette scène.";
      }
      els.scene.append(txt);
      els.link.disabled = !sceneReady;
      els.replay.disabled = !(sceneLink && sceneLink.url);
      els.unlink.disabled = !(sceneLink && sceneLink.url);
    }

    function render() {
      renderStatus();
      renderLibrary();
      renderScene();
      const settings = metadata[SETTINGS_KEY];
      els.auto.checked = !(settings && settings.auto === false);
    }

    /* ----------------------------- événements ----------------------------- */
    els.form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const url = cleanUrl(els.url.value);
      if (!url) { say("Adresse invalide : utilisez un lien https direct vers une image.", true); return; }
      try {
        await display(url, els.title.value.trim());
        say("Décor envoyé aux joueurs.");
      } catch (err) { say("Échec de l'envoi : " + err.message, true); }
    });

    els.save.addEventListener("click", async () => {
      const url = cleanUrl(els.url.value);
      if (!url) { say("Adresse invalide : utilisez un lien https direct vers une image.", true); return; }
      try { await addToLibrary(url, els.title.value.trim()); }
      catch (err) { say("Enregistrement impossible : " + err.message, true); }
    });

    els.hide.addEventListener("click", async () => {
      try { await clearDisplay(); say("Décor retiré."); }
      catch (err) { say("Échec : " + err.message, true); }
    });

    els.link.addEventListener("click", async () => {
      const url = cleanUrl(els.url.value);
      if (!url) { say("Saisissez d'abord l'adresse d'une image (https).", true); return; }
      try { await linkScene(url, els.title.value.trim()); }
      catch (err) { say("Liaison impossible : " + err.message, true); }
    });

    els.replay.addEventListener("click", async () => {
      if (!sceneLink) return;
      try { await display(sceneLink.url, sceneLink.title); say("Décor de la scène réaffiché."); }
      catch (err) { say("Échec : " + err.message, true); }
    });

    els.unlink.addEventListener("click", async () => {
      try {
        await OBR.scene.setMetadata({ [SCENE_KEY]: undefined });
        sceneLink = null;
        renderScene();
        say("Décor délié de cette scène.");
      } catch (err) { say("Échec : " + err.message, true); }
    });

    els.auto.addEventListener("change", async () => {
      try { await write({ [SETTINGS_KEY]: { auto: els.auto.checked } }); }
      catch (err) { say("Échec : " + err.message, true); }
    });

    /* ------------------------------- démarrage ------------------------------- */
    OBR.onReady(async () => {
      try {
        isGM = (await OBR.player.getRole()) === "GM";
        document.body.classList.toggle("player", !isGM);
        metadata = await OBR.room.getMetadata();
        render();
        OBR.room.onMetadataChange((m) => { metadata = m; render(); });
        await refreshScene();
        OBR.scene.onReadyChange(() => refreshScene());
        OBR.scene.onMetadataChange((m) => { sceneLink = m[SCENE_KEY] || null; renderScene(); });
      } catch (err) {
        say("Erreur d'initialisation : " + err.message, true);
      }
    });
  </script>
</body>
</html>
