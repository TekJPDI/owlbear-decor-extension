<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestionnaire de Décors</title>
  <script src="https://sdk.owlbear.rodeo/sdk.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 12px;
      margin: 0;
    }
    h3 { margin-top: 0; color: #f38ba8; text-align: center; font-size: 16px; }
    .card {
      background: #313244;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    input[type="text"], input[type="file"] {
      width: 90%;
      padding: 6px;
      margin-bottom: 6px;
      background: #181825;
      border: 1px solid #45475a;
      color: #fff;
      border-radius: 4px;
    }
    input[type="file"] {
      font-size: 12px;
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-add { background: #a6e3a1; color: #11111b; }
    .btn-show { background: #89b4fa; color: #11111b; }
    .btn-close { background: #f38ba8; color: #11111b; margin-top: 10px; }
    .decor-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #181825;
      padding: 6px 10px;
      border-radius: 4px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <h3>🎬 Décors Locaux</h3>

  <div class="card">
    <input type="text" id="decorTitle" placeholder="Nom du lieu (ex: Le Diner)">
    <input type="file" id="decorFile" accept="image/*">
    <button class="btn-add" id="addBtn">➕ Importer depuis mon PC</button>
  </div>

  <div class="card" id="decorList">
    <small style="color: #a6adc8;">Aucun décor chargé pour le moment.</small>
  </div>

  <button class="btn-close" id="closeAllBtn">🛑 Retirer l'Écran de Décor</button>

  <script>
    let decors = [];

    // Définition de showDecor pour qu'elle soit accessible globalement
    window.showDecor = function(index) {
      const decor = decors[index];
      if (decor) {
        OBR.broadcast.sendMessage("DECOR_EVENT", { action: "SHOW", dataUrl: decor.dataUrl });
        OBR.modal.open({
          url: "https://tekjpdi.github.io/owlbear-decor-extension/display.html",
          fullScreen: true
        });
      }
    };

    OBR.onReady(() => {
      // Écouteur sur le bouton d'ajout
      document.getElementById('addBtn').addEventListener('click', () => {
        const titleInput = document.getElementById('decorTitle');
        const fileInput = document.getElementById('decorFile');
        
        const title = titleInput.value.trim();
        const file = fileInput.files[0];

        if (!title) {
          alert("Veuillez entrer un nom pour le décor.");
          return;
        }

        if (!file) {
          alert("Veuillez sélectionner une image sur votre ordinateur.");
          return;
        }

        // Lecture synchrone du fichier sélectionné
        const reader = new FileReader();
        reader.onload = (event) => {
          decors.push({ title: title, dataUrl: event.target.result });
          renderList();
          
          // Réinitialisation des champs
          titleInput.value = '';
          fileInput.value = '';
        };
        reader.readAsDataURL(file);
      });

      // Bouton de fermeture globale
      document.getElementById('closeAllBtn').addEventListener('click', () => {
        OBR.broadcast.sendMessage("DECOR_EVENT", { action: "CLOSE" });
        OBR.modal.close();
      });
    });

    function renderList() {
      const container = document.getElementById('decorList');
      container.innerHTML = '';
      decors.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'decor-item';
        div.innerHTML = `
          <span><b>${item.title}</b></span>
          <button class="btn-show" onclick="window.showDecor(${index})">📺 Projeter</button>
        `;
        container.appendChild(div);
      });
    }
  </script>
</body>
</html>
