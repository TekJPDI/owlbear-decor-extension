<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Décor d'ambiance</title>
  <style>
    :root {
      --ink: #0b0d12;
      --text: #ece7da;
      --lantern: #e0b25a;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--ink);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    /* Mode arrière-plan : la page est invisible */
    body.background { background: transparent; }

    #stage { position: fixed; inset: 0; display: none; }
    body.view #stage { display: block; }

    /* Chaque décor est une couche ; on fond d'une couche à l'autre */
    .layer { position: absolute; inset: 0; opacity: 0; transition: opacity 1s ease; }
    .layer.in { opacity: 1; }
    .layer .backdrop {
      position: absolute; inset: -5%; width: 110%; height: 110%;
      object-fit: cover;
      filter: blur(40px) brightness(.45) saturate(1.1);
    }
    .layer .picture { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }

    #caption {
      position: absolute; left: 50%; bottom: 4vh;
      transform: translateX(-50%);
      max-width: 80vw;
      padding: .55em 1.4em;
      font: italic 500 clamp(1rem, 2.2vw, 1.7rem)/1.3 Georgia, "Times New Roman", serif;
      letter-spacing: .02em;
      text-align: center;
      color: var(--text);
      text-shadow: 0 2px 12px rgba(0,0,0,.9);
      background: linear-gradient(transparent, rgba(0,0,0,.45));
      border-radius: 999px;
      transition: opacity .6s ease;
    }
    #caption:empty { display: none; }

    #error {
      position: absolute; inset: 0;
      display: none; place-items: center;
      text-align: center; padding: 2rem;
      font-size: 1.1rem; line-height: 1.5;
    }
    #error.show { display: grid; }

    #controls {
      position: absolute; top: 14px; right: 14px;
      display: flex; gap: 8px;
      opacity: 0; transition: opacity .25s ease;
    }
    body.view:hover #controls, #controls:focus-within { opacity: 1; }
    @media (hover: none) { #controls { opacity: 1; } }

    #controls button {
      font: inherit; font-size: .9rem;
      color: var(--text);
      background: rgba(11,13,18,.72);
      border: 1px solid rgba(236,231,218,.3);
      border-radius: 8px;
      padding: .5em .9em;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }
    #controls button:hover { border-color: var(--lantern); color: var(--lantern); }
    #controls button:focus-visible { outline: 2px solid var(--lantern); outline-offset: 2px; }
    #clear-all[hidden] { display: none; }

    @media (prefers-reduced-motion: reduce) {
      .layer, #caption, #controls { transition: none; }
    }
  </style>
</head>
<body>

  <div id="stage">
    <div id="error" role="alert"></div>
    <div id="caption"></div>
    <div id="controls">
      <button id="clear-all" type="button" hidden>Retirer pour tous</button>
      <button id="close-local" type="button">Masquer chez moi</button>
    </div>
  </div>

  <script type="module">
    import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3";

    const NS          = "com.tekjpdi.decor";
    const STATE_KEY   = `${NS}/state`;      // { active, url, title, ts }
    const MODAL_ID    = `${NS}/display`;
    const DISMISS_KEY = `${NS}.dismissed`;  // dernier décor masqué localement
    const SCENE_KEY    = `${NS}/scene`;     // métadonnée de scène : { url, title }
    const SETTINGS_KEY = `${NS}/settings`;  // métadonnée de salle : { auto }

    const params = new URLSearchParams(location.search);
    const isView = params.get("view") === "1";
    document.body.classList.add(isView ? "view" : "background");

    /* ------------------------------------------------------------------ *
     *  MODE VUE : page ouverte en modale plein écran
     * ------------------------------------------------------------------ */
    async function runView() {
      const stage   = document.getElementById("stage");
      const caption = document.getElementById("caption");
      const error   = document.getElementById("error");
      const FADE = 1000;
      let currentTs = params.get("ts") || "";
      let layer = null;
      let closeTimer = null;

      function setCaption(text) {
        caption.style.opacity = "0";
        setTimeout(() => { caption.textContent = text; caption.style.opacity = "1"; }, 350);
      }

      // Fondu enchaîné : la nouvelle image apparaît par-dessus, l'ancienne s'efface
      function showImage(src, text) {
        clearTimeout(closeTimer);
        error.classList.remove("show");
        const next = document.createElement("div");
        next.className = "layer";
        const bg = new Image();
        bg.className = "backdrop"; bg.alt = ""; bg.setAttribute("aria-hidden", "true");
        const pic = new Image();
        pic.className = "picture"; pic.alt = "Décor d'ambiance";
        next.append(bg, pic);

        pic.addEventListener("load", () => {
          stage.insertBefore(next, caption);
          requestAnimationFrame(() => requestAnimationFrame(() => next.classList.add("in")));
          const old = layer;
          layer = next;
          if (old) {
            old.classList.remove("in");
            setTimeout(() => old.remove(), FADE + 100);
          }
          setCaption(text);
        });
        pic.addEventListener("error", () => {
          error.textContent = "L'image n'a pas pu être chargée. Vérifiez que l'adresse est un lien direct vers une image en https.";
          error.classList.add("show");
        });
        bg.src = src;
        pic.src = src;
      }

      // Fondu vers le noir puis fermeture de la modale
      function fadeOutAndClose() {
        if (layer) layer.classList.remove("in");
        caption.style.opacity = "0";
        clearTimeout(closeTimer);
        closeTimer = setTimeout(() => OBR.modal.close(MODAL_ID).catch(() => {}), FADE + 100);
      }

      async function closeLocal() {
        try { localStorage.setItem(DISMISS_KEY, currentTs); } catch (_) {}
        try { await OBR.modal.close(MODAL_ID); } catch (_) {}
      }

      showImage(params.get("src") || "", params.get("title") || "");

      document.getElementById("close-local").addEventListener("click", closeLocal);
      window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLocal(); });

      OBR.onReady(async () => {
        try {
          const role = await OBR.player.getRole();
          if (role === "GM") {
            const btn = document.getElementById("clear-all");
            btn.hidden = false;
            btn.addEventListener("click", async () => {
              const st = (await OBR.room.getMetadata())[STATE_KEY] || {};
              await OBR.room.setMetadata({
                [STATE_KEY]: { active: false, url: st.url || "", title: st.title || "", ts: Date.now() }
              });
            });
          }
        } catch (err) {
          console.error("[Décors] Rôle introuvable :", err);
        }

        // Le décor change en direct, sans fermer ni rouvrir la modale
        OBR.room.onMetadataChange((m) => {
          const st = m[STATE_KEY];
          if (!st || !st.active || !st.url) { fadeOutAndClose(); return; }
          if (String(st.ts) === currentTs) return;
          currentTs = String(st.ts);
          showImage(st.url, st.title || "");
        });
      });
    }

    /* ------------------------------------------------------------------ *
     *  MODE ARRIÈRE-PLAN : écoute l'état de la salle et ouvre/ferme la modale
     * ------------------------------------------------------------------ */
    function runBackground() {
      let openedTs = null;
      let closeTimer = null;
      let busy = Promise.resolve();

      const viewUrl = (st) => {
        const u = new URL("display.html", location.href);
        u.search = new URLSearchParams({
          view: "1",
          src: st.url,
          title: st.title || "",
          ts: String(st.ts)
        }).toString();
        return u.toString();
      };

      async function sync(metadata) {
        const st = metadata ? metadata[STATE_KEY] : null;

        // Plus de décor : la modale se ferme d'elle-même après son fondu ;
        // on garde une fermeture de secours au cas où.
        if (!st || !st.active || !st.url) {
          if (openedTs !== null) {
            openedTs = null;
            clearTimeout(closeTimer);
            closeTimer = setTimeout(() => {
              if (openedTs === null) OBR.modal.close(MODAL_ID).catch(() => {});
            }, 1800);
          }
          return;
        }

        if (st.ts === openedTs) return;
        clearTimeout(closeTimer);

        let dismissed = null;
        try { dismissed = localStorage.getItem(DISMISS_KEY); } catch (_) {}
        if (dismissed === String(st.ts)) { openedTs = st.ts; return; }

        // Modale déjà ouverte : elle se met à jour toute seule (fondu enchaîné)
        const wasOpen = openedTs !== null && dismissed !== String(openedTs);
        openedTs = st.ts;
        if (wasOpen) return;

        try {
          await OBR.modal.open({
            id: MODAL_ID,
            url: viewUrl(st),
            fullScreen: true,
            hideBackdrop: true,
            hidePaper: true
          });
        } catch (err) {
          console.error("[Décors] Ouverture impossible :", err);
          openedTs = null;
        }
      }

      const queue = (metadata) => { busy = busy.then(() => sync(metadata)); };

      // MJ uniquement : à chaque changement de scène, on applique le décor lié
      async function watchScenes() {
        async function applyScene() {
          try {
            const [sceneMeta, roomMeta] = await Promise.all([OBR.scene.getMetadata(), OBR.room.getMetadata()]);
            const settings = roomMeta[SETTINGS_KEY];
            if (settings && settings.auto === false) return;
            const link = sceneMeta[SCENE_KEY];
            const st = roomMeta[STATE_KEY] || {};
            if (link && link.url) {
              await OBR.room.setMetadata({
                [STATE_KEY]: { active: true, url: link.url, title: link.title || "", ts: Date.now() }
              });
            } else if (st.active) {
              // Scène sans décor : on retire celui de la scène précédente
              await OBR.room.setMetadata({
                [STATE_KEY]: { active: false, url: st.url || "", title: st.title || "", ts: Date.now() }
              });
            }
          } catch (err) {
            console.error("[Décors] Application du décor de scène impossible :", err);
          }
        }

        // Le premier chargement de la page n'est pas un changement de scène
        let skipNext = !(await OBR.scene.isReady());
        OBR.scene.onReadyChange((ready) => {
          if (!ready) return;
          if (skipNext) { skipNext = false; return; }
          applyScene();
        });
      }

      OBR.onReady(async () => {
        try { queue(await OBR.room.getMetadata()); } catch (err) { console.error(err); }
        OBR.room.onMetadataChange(queue);
        try {
          if ((await OBR.player.getRole()) === "GM") await watchScenes();
        } catch (err) { console.error(err); }
      });
    }

    isView ? runView() : runBackground();
  </script>
</body>
</html>
