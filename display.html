<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Décor</title>
  <script src="https://sdk.owlbear.rodeo/sdk.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <img id="decorImg" src="" alt="Décor d'ambiance">

  <script>
    OBR.onReady(() => {
      OBR.broadcast.onMessage("DECOR_EVENT", (event) => {
        if (event.data.action === "SHOW" && event.data.dataUrl) {
          document.getElementById('decorImg').src = event.data.dataUrl;
        } else if (event.data.action === "CLOSE") {
          OBR.modal.close();
        }
      });
    });
  </script>
</body>
</html>
