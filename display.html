<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Décor</title>
  <script src="https://sdk.owlbear.rodeo/sdk.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      background-color: #000; overflow: hidden;
      display: flex; justify-content: center; align-items: center;
    }
    img { max-width: 100%; max-height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <img id="decorImg" src="" alt="Décor">
  <script>
    // Charge instantanément l'image via le paramètre URL (zéro délai de réseau)
    const urlParams = new URLSearchParams(window.location.search);
    const imgUrl = urlParams.get('img');
    if (imgUrl) {
      document.getElementById('decorImg').src = imgUrl;
    }

    OBR.onReady(() => {
      OBR.broadcast.onMessage("DECOR_EVENT", (event) => {
        if (event.data.action === "SHOW" && event.data.url) {
          document.getElementById('decorImg').src = event.data.url;
        } else if (event.data.action === "CLOSE") {
          OBR.modal.close("owlbear-decor-display");
        }
      });
    });
  </script>
</body>
</html>
